body{position:relative;margin:0;min-height:100vh;background:var(--desk);font:15px/1.6 var(--ui);color:var(--ink);padding-bottom:40px}
button{font:inherit;color:inherit}
a{color:var(--link)}
:focus-visible{outline:2px dotted var(--ink);outline-offset:2px}
svg{shape-rendering:crispEdges}

#page{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:32px 16px 0;display:flex;flex-direction:column;gap:32px}

/* ---------- top bar: title + menu (plain blue bar until images/frame-top.png loads) ---------- */
.bar{width:min(1068px,calc(100% - 32px));margin:28px auto 0;padding:14px 28px 10px;color:var(--hdr-ink);
  border:3px solid var(--frame);border-radius:9px;box-shadow:0 2px 10px rgba(0,0,0,.28);
  background:linear-gradient(var(--title-a),var(--title-b))}
.bar .sep{flex:none;align-self:center;width:3px;height:1.1em;background:rgba(255,255,255,.75)}
.bar .ttl{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 24px;min-width:0}
.bar .nm{margin:0;font:700 clamp(28px,5vw,48px)/1.05 var(--name-font);text-shadow:2px 2px 0 rgba(0,0,0,.35)}
.bar .rl{margin:0;font:400 clamp(15px,2vw,21px)/1.3 var(--name-font);text-shadow:1px 1px 0 rgba(0,0,0,.4);max-width:none}
.bar .menu{display:flex;align-items:center;flex-wrap:wrap;gap:2px 4px;margin-top:12px}
.bar .menu a{color:#fff;text-decoration:none;padding:2px 10px;font:400 16px var(--name-font)}
.bar .menu a:hover,.bar .menu a.act{background:rgba(255,255,255,.22)}
.h1{font:700 34px/1.15 var(--px);margin:0 0 8px}

/* with your frame-top image: a real window title bar and menu bar, sticky so the menu stays in reach */
body.hdr-img{--stick-h:calc(var(--k) * (var(--th) - var(--t2)) * 1px)}
body.hdr-img .bar{position:sticky;top:calc(var(--k) * var(--t2) * -1px);z-index:100;width:100%;height:calc(var(--k) * var(--th) * 1px);
  margin:0;padding:0;border:0;border-radius:0;box-shadow:none;background:none}
.bar .cap{z-index:1}
.bar .cap,.bar .fill{position:absolute;top:0;bottom:0;background-image:var(--hdr-img);background-repeat:no-repeat}
.bar .cap.l{left:0;width:calc(var(--k) * var(--tl) * 1px);background-position:left top;background-size:calc(var(--k) * var(--tw) * 1px) 100%}
.bar .cap.r{right:0;width:calc(var(--k) * var(--tr) * 1px);background-position:right top;background-size:calc(var(--k) * var(--tw) * 1px) 100%}
.bar .fill{left:0;right:0;z-index:0;
  background-size:calc(var(--k) * var(--tw) * 10px) 100%;background-position:calc(var(--k) * var(--tx) * -10px) 0}   /* stretches a flat part of your image */
body.hdr-img .bar .sep{width:calc(var(--k) * 9px);height:calc(var(--k) * (var(--t2) - var(--t1)) * .56px);background:#bfbfbf}
body.hdr-img .bar .ttl{position:absolute;z-index:2;flex-wrap:nowrap;align-items:center;gap:0 .7em;
  left:calc(var(--k) * var(--tl) * 1px + 14px);right:calc(var(--k) * var(--tr) * 1px + 6px);
  top:calc(var(--k) * var(--t1) * 1px);height:calc(var(--k) * (var(--t2) - var(--t1)) * 1px)}
body.hdr-img .bar .nm{flex:none;font-size:calc(var(--k) * (var(--t2) - var(--t1)) * .6px);text-shadow:none;line-height:1}
body.hdr-img .bar .rl{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:calc(var(--k) * (var(--t2) - var(--t1)) * .4px);text-shadow:none}
body.hdr-img .bar .menu{position:absolute;z-index:2;margin:0;flex-wrap:nowrap;overflow:hidden;gap:0 2px;
  left:calc(var(--k) * var(--tl) * 1px + 8px);right:10px;top:calc(var(--k) * var(--t2) * 1px);height:calc(var(--k) * (var(--m2) - var(--t2)) * 1px)}
body.hdr-img .bar .menu a{color:#000;padding:1px 10px;font-size:max(15px, calc(var(--k) * (var(--m2) - var(--t2)) * .36px))}
body.hdr-img .bar .menu a:hover{background:#000080;color:#fff}
body.hdr-img .bar .menu a.act{background:none;box-shadow:inset 1px 1px #818181, inset -1px -1px #fff}
body.hdr-img .bar .menu{transition:background-color .15s}
body.hdr-img.scrolled .bar .menu{background:#000080;left:calc(var(--k) * var(--tl) * 1px);right:calc(var(--k) * var(--tr) * 1px);padding:0 0 0 8px}
body.hdr-img.scrolled .bar .menu a{color:#fff}
body.hdr-img.scrolled .bar .menu a:hover{background:#fff;color:#000080}
body.hdr-img.scrolled .bar .menu a.act{background:#1c1ccc;box-shadow:inset 1px 1px #8080ff, inset -1px -1px #00004a}
body.sharp .bar .cap,body.sharp .bar .fill,body.sharp .frame::before,body.sharp .frame::after{image-rendering:pixelated}
.frame{position:relative;width:100%}
body.frm-img .frame{padding-inline:var(--frm-bw)}
body.frm-img .frame::before,body.frm-img .frame::after{content:'';position:absolute;top:0;bottom:0;width:var(--frm-bw);pointer-events:none;
  background-image:var(--frm-img);background-repeat:repeat-y;background-size:calc(var(--fw) * var(--k) * 1px) auto}
body.frm-img .frame::before{left:0;background-position:left top}
body.frm-img .frame::after{right:0;background-position:right top}
/* the dark inner edge of the window continues along the bottom of the bar, so top and sides join up */
body.hdr-img.frm-img .bar::after{content:'';position:absolute;z-index:3;pointer-events:none;left:calc(var(--k) * (var(--frm-slice) - 9) * 1px);right:calc(var(--k) * (var(--frm-slice) - 9) * 1px);
  bottom:calc(var(--k) * -9px);height:calc(var(--k) * 9px);background:#000}

/* ---------- window frame (used by every section) ---------- */
.win{background:var(--chrome);border:3px solid var(--frame);border-top:0;border-radius:9px 9px 0 0;box-shadow:0 2px 10px rgba(0,0,0,.28);scroll-margin-top:calc(var(--stick-h,0px) + 20px);min-width:0}
.titlebar{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 8px;margin:0 -3px;border-radius:7px 7px 0 0;color:#fff;background:linear-gradient(var(--title-a),var(--title-b))}
.titlebar svg{width:18px;height:18px;flex:none}
.titlebar .t{flex:1;margin:0;font:400 16px/1.3 var(--px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb{width:22px;height:22px;border:1px solid #fff;border-radius:4px;padding:0;display:inline-flex;align-items:center;justify-content:center;background:var(--tb);color:#fff;font:bold 12px/1 var(--ui)}
.tb.x{background:#d4502c}
button.tb:active{filter:brightness(.85)}
.win > .body,.win > .inner{background:var(--paper);border:1px solid var(--paper-line);padding:20px 22px}
.win.collapsed > .body{display:none}
h1,h2,h3{font-family:var(--px);font-weight:700;line-height:1.15;margin:0 0 8px}
h1{font-size:34px} h3{font-size:19px}
p{margin:0 0 12px;max-width:68ch}
code{font:13px Consolas,monospace;background:var(--meta-bg);padding:1px 5px;border:1px solid var(--meta-line)}

.btn{display:inline-block;padding:5px 16px;min-width:80px;text-align:center;text-decoration:none;color:var(--ink);background:var(--btn-bg);border:1px solid var(--btn-line);border-radius:3px;margin:2px 8px 4px 0}
.btn:hover{background:var(--btn-hover)}
.btn:active{background:var(--btn-active)}
.btn.big{padding:9px 26px;font-weight:bold;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px;padding:0;list-style:none}
.chips li{padding:2px 9px;background:var(--chip-bg);border:1px solid var(--chip-line);border-radius:3px;font-size:14px}
.ph{display:grid;place-items:center;text-align:center;padding:22px 12px;color:var(--ph-ink);font-size:14px;border:2px dashed var(--chip-line);
  background:repeating-conic-gradient(var(--ph-bg) 0 25%, var(--chrome) 0 50%) 0 0/28px 28px}
.ph svg{width:44px;height:44px}

/* ---------- 1. showreel ---------- */
.stage{width:min(100%, calc(68vh * 16 / 9));aspect-ratio:16/9;margin:0 auto;background:#000;position:relative;border:2px solid var(--paper-line)}
.stage video,.stage iframe{width:100%;height:100%;border:0;display:block;background:#000}
.stage .poster{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;background:#000}
.stage .poster img{width:100%;height:100%;object-fit:cover;display:block;opacity:.9}
.stage .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:76px;height:76px;display:grid;place-items:center;
  background:var(--title-b);color:#fff;border:3px solid #fff;font-size:30px;padding-left:6px}
.stage .vph{height:100%;border:0}
.vcap{margin:12px 0 10px;text-align:center}
.reel[hidden]{display:none}
.reel{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.vthumb{width:170px;padding:4px;background:var(--btn-bg);border:2px solid var(--paper-line);text-align:left}
.vthumb.on{border-color:var(--frame);background:var(--chip-bg)}
.vthumb .vt{display:block;aspect-ratio:16/9;overflow:hidden;background:#000}
.vthumb .vt img{width:100%;height:100%;object-fit:cover;display:block}
.vthumb .vt .ph{height:100%;padding:0;border-width:1px}
.vthumb .vt .ph svg{width:30px;height:30px}
.vthumb .vl{display:block;font-size:13px;margin-top:4px;line-height:1.25}

/* ---------- 2. about ---------- */
.about{display:grid;grid-template-columns:200px 1fr;gap:28px;align-items:start}
.avatar{width:100%;aspect-ratio:1;border:2px solid var(--paper-line);overflow:hidden;background:var(--chip-bg);display:grid;place-items:center}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar svg{width:70%;height:70%}
.role{font:700 18px var(--px);color:var(--muted);margin-bottom:14px}
.seek{margin:16px 0;padding:12px 16px;background:var(--accent);border:2px solid var(--accent-line);max-width:68ch}
.seek strong{font-family:var(--px);font-size:18px;display:block;margin-bottom:2px}

/* ---------- 3. projects ---------- */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{display:flex;flex-direction:column;padding:0;text-align:left;background:var(--btn-bg);border:2px solid var(--paper-line);min-width:0}
.card:hover,.card:focus-visible{border-color:var(--frame);background:var(--chip-bg)}
.card .thumb{display:block;aspect-ratio:16/9;overflow:hidden;background:var(--chrome);border-bottom:2px solid var(--paper-line)}
.card .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.card .thumb .ph{height:100%;border:0}
.card .info{display:flex;flex-direction:column;gap:3px;padding:12px 14px 14px}
.card .ct{font:700 19px/1.2 var(--px)}
.card .cb{font-size:14px}
.card .cm{font-size:13px;color:var(--muted)}
.card .badge{align-self:flex-start;font:700 13px var(--px);padding:1px 8px;background:var(--accent);border:1px solid var(--accent-line);margin-bottom:4px}
.card.feat{grid-column:1/-1;display:grid;grid-template-columns:1.6fr 1fr}
.card.feat .thumb{border-bottom:0;border-right:2px solid var(--paper-line);aspect-ratio:16/10}
.card.feat .info{justify-content:center;padding:22px 26px;gap:8px}
.card.feat .ct{font-size:30px}
.card.feat .cb{font-size:16px}

/* ---------- 4. skills + contact ---------- */
.row2{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}
.links{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:4px 18px}
.foot{align-self:center;padding:6px 16px;background:var(--chrome);border:2px solid var(--chrome-line);font-size:13px;text-align:center}

/* ---------- case-study dialog ---------- */
dialog.win{padding:0;margin:auto;width:min(780px,94vw);max-height:90vh;color:var(--ink)}
dialog.win[open]{display:flex;flex-direction:column}
dialog.win::backdrop{background:rgba(0,0,0,.5)}
dialog.win > .body{overflow:auto;flex:1}
.meta{display:grid;grid-template-columns:max-content 1fr;gap:3px 16px;margin:10px 0 14px;padding:10px 12px;background:var(--meta-bg);border:1px solid var(--meta-line)}
.meta dt{font-weight:bold}.meta dd{margin:0}
.case h3{margin-top:20px}
.shot{margin:10px 0 16px}
.shot img{display:block;max-width:100%;border:2px solid var(--paper-line)}
.shot figcaption{font-size:13px;color:var(--muted);margin-top:4px}

@media (max-width:760px){
  body{font-size:16px}
  h1,.h1{font-size:28px}
  .win > .body,.win > .inner{padding:16px 14px}
  .about{grid-template-columns:1fr}
  .avatar{width:140px}
  .card.feat{grid-template-columns:1fr}
  .card.feat .thumb{border-right:0;border-bottom:2px solid var(--paper-line);aspect-ratio:16/9}
  .card.feat .ct{font-size:24px}
  .row2{grid-template-columns:1fr}
  .vthumb{width:calc(50% - 5px)}
}
</style>
</head>

const SITE = {

function showreelHTML(){
  return winHTML('showreel', 'showreel.exe', 'video', `

    <div class="reel"${VLIST.length < 2 ? ' hidden' : ''}>${VLIST.map((v,i) => {
      const poster = v.poster || (v.youtube ? `https://i.ytimg.com/vi/${v.youtube}/hqdefault.jpg` : '');
      return `<button class="vthumb" data-v="${i}" aria-label="Show video: ${esc(v.title)}"><span class="vt">${
        poster ? `<img src="${esc(poster)}" alt="" loading="lazy">` : `<span class="ph">${ic('video')}</span>`}</span><span class="vl">${esc(v.title)}</span></button>`;
    }).join('')}</div>`);

function showVideo(i, play){
  const v = VLIST[i], st = $('#stage');
  document.querySelectorAll('.vthumb').forEach((b, j) => { b.classList.toggle('on', j === i); b.setAttribute('aria-pressed', j === i); });
  $('#vcap').innerHTML = `<strong>${esc(v.title)}</strong>${v.caption ? ' · ' + esc(v.caption) : ''}`;
  if (v.src){
    st.innerHTML = `<video controls playsinline preload="metadata"${v.poster ? ` poster="${esc(v.poster)}"` : ''} src="${esc(v.src)}"></video>`;
    const vid = st.firstElementChild;
    vid.addEventListener('error', () => { st.innerHTML = `<div class="ph vph"><div>${ic('video')}<br>Video could not be loaded:<br><code>${esc(v.src)}</code><br>Check the file name, that it is in the videos folder, and that it is an H.264 MP4.</div></div>`; }, true);
    if (play) vid.play().catch(() => {});
  } else if (v.youtube){
    if (play){
      st.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${esc(v.youtube)}?autoplay=1&rel=0" title="${esc(v.title)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
    } else {
      const poster = v.poster || `https://i.ytimg.com/vi/${v.youtube}/hqdefault.jpg`;
      st.innerHTML = `<button class="poster" data-play aria-label="Play ${esc(v.title)}"><img src="${esc(poster)}" alt=""><span class="play">▶</span></button>`;
    }
  } else {
    st.innerHTML = `<div class="ph vph"><div>${ic('video')}<br>Video placeholder.<br>Set <code>youtube</code> or <code>src</code> in the VIDEOS list.</div></div>`;
  }
}

/* highlight the tab for the section you are reading */
let ticking = false;
function markActive(){
  ticking = false;
  const k = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--k')), pin = (k && SITE.topFrame) ? k * SITE.topFrame.title[1] - 1 : 60;
  document.body.classList.toggle('scrolled', scrollY >= pin);          // once the menu bar is pinned, it turns blue
  let cur = NAV[0][0];
  NAV.forEach(([id]) => { const el = document.getElementById(id); if (el && el.getBoundingClientRect().top <= innerHeight * 0.4) cur = id; });
  if (innerHeight + scrollY >= document.documentElement.scrollHeight - 6) cur = 'contact';
  document.querySelectorAll('.menu a').forEach(t => { const on = t.dataset.go === cur; t.classList.toggle('act', on); if (t.tagName === 'A') on ? t.setAttribute('aria-current', 'true') : t.removeAttribute('aria-current'); });
}
addEventListener('scroll', () => { if (!ticking){ ticking = true; requestAnimationFrame(markActive); } }, { passive: true });
addEventListener('resize', markActive); markActive();

const FONTS = ['Pixelify Sans', 'Silkscreen', 'Press Start 2P', 'VT323', 'Jersey 10', 'Tiny5', 'DotGothic16'];
(function setupHeader(){
  const root = document.documentElement, body = document.body;
  let f = new URLSearchParams(location.search).get('font') || SITE.nameFont;      // try a font live with ?font=Silkscreen
  if (!FONTS.includes(f)) f = 'Pixelify Sans';
  if (f !== 'Pixelify Sans'){
    const l = document.createElement('link'); l.rel = 'stylesheet';
    l.href = 'https://fonts.googleapis.com/css2?family=' + f.replace(/ /g, '+') + '&display=swap'; document.head.appendChild(l);
  }
  root.style.setProperty('--name-font', `'${f}','Pixelify Sans','Tahoma',monospace`);
  root.style.setProperty('--hdr-ink', SITE.headerInk || '#fff');
  $('#top').innerHTML = `<div class="ttl"><h1 class="nm">${esc(SITE.name)}</h1><span class="sep" aria-hidden="true"></span><p class="rl">${esc(SITE.role)}</p></div>
    <nav class="menu" aria-label="Sections">${NAV.map(([id, label]) => `<a href="#${id}" data-go="${id}"><u>${label[0]}</u>${label.slice(1)}</a>`).join('')}</nav>`;
  if (SITE.sharp) body.classList.add('sharp');
  markActive();

  const setScale = () => {
    const dpr = window.devicePixelRatio || 1, want = innerWidth < 700 ? SITE.pixelSizeSmall : SITE.pixelSize;
    const n = Math.max(3, 3 * Math.round(want * dpr / 3));                         // screen pixels per art pixel: always a multiple of 3
    const k = n / dpr / SITE.sourcePixel;                                          // CSS pixels per file pixel
    root.style.setProperty('--k', k);
    if (SITE._inset) root.style.setProperty('--frm-bw', (Math.round(SITE._inset * k * dpr) / dpr) + 'px');
  };
  setScale(); addEventListener('resize', setScale);

  if (SITE.headerImage){
    const im = new Image();
    im.onload = () => {
      const tf = SITE.topFrame;
      const v = { tw: im.naturalWidth, th: im.naturalHeight, tl: tf.leftCap, tr: tf.rightCap, tx: tf.fillAt, t1: tf.title[0], t2: tf.title[1], m2: tf.menu[1] };
      Object.entries(v).forEach(([n, x]) => root.style.setProperty('--' + n, x));
      root.style.setProperty('--hdr-img', `url("${SITE.headerImage}")`);
      ['cap l', 'fill', 'cap r'].reverse().forEach(c => { const e = document.createElement('span'); e.className = c; e.setAttribute('aria-hidden', 'true'); $('#top').prepend(e); });
      body.classList.add('hdr-img');
    };
    im.src = SITE.headerImage;
  }
  if (SITE.sideImage){
    const im = new Image();
    im.onload = () => {
      let inset = 51;                                                              // edge thickness in file pixels (auto-detected when possible)
      try {
        const c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight;
        const g = c.getContext('2d'); g.drawImage(im, 0, 0);
        const row = g.getImageData(0, Math.floor(c.height / 2), c.width, 1).data;
        let x = 0; while (x < c.width / 3 && row[x * 4 + 3] > 8) x++;
        if (x >= 4 && x < c.width / 3) inset = x;
      } catch (e) {}
      root.style.setProperty('--frm-img', `url("${SITE.sideImage}")`);
      root.style.setProperty('--frm-slice', inset);
      root.style.setProperty('--fw', im.naturalWidth);
      SITE._inset = inset; setScale();
      body.classList.add('frm-img');
    };
    im.src = SITE.sideImage;
  }
})();
function applyLook(){
  const root = document.documentElement, st = document.body.style;
  root.style.setProperty('--desk', SITE.wallpaperColor);
  if (SITE.cursorImage){
    const [hx, hy] = SITE.cursorHotspot || [0, 0];
    root.style.removeProperty('--cursor');
    const fallback = getComputedStyle(root).getPropertyValue('--cursor').trim();      // built-in pixel arrow
    const src = SITE.cursorImage2x ? `image-set(url("${SITE.cursorImage}") 1x, url("${SITE.cursorImage2x}") 2x)` : `url("${SITE.cursorImage}")`;
    root.style.setProperty('--cursor', `${src} ${hx} ${hy}, ${fallback}`);
  }
  if (SITE.wallpaper === 'image' && SITE._imgOk === undefined){                       // if the image can't load, fall back to the drawn checkerboard
    SITE._imgOk = null;
    const probe = new Image();
    probe.onload = () => { SITE._imgOk = true; };
    probe.onerror = () => { SITE._imgOk = false; applyLook(); };
    probe.src = SITE.wallpaperImage;
  }
  const useImage = SITE.wallpaper === 'image' && SITE._imgOk !== false;
  const useChecker = SITE.wallpaper === 'checker' || (SITE.wallpaper === 'image' && SITE._imgOk === false);
  if (useChecker){
    const q = SITE.checkerSize, f = SITE.checkerFade;
    Object.assign(st, {
      backgroundImage: `linear-gradient(to right, rgba(0,0,0,0), rgba(0,0,0,${f})), repeating-conic-gradient(${SITE.checkerDark} 0 25%, ${SITE.checkerLight} 0 50%)`,
      backgroundSize: `auto, ${q * 2}px ${q * 2}px`, backgroundPosition: 'center top', backgroundRepeat: 'repeat'
    });
  } else if (useImage){
    Object.assign(st, { backgroundImage: `url("${SITE.wallpaperImage}")`, backgroundSize: SITE.wallpaperFit, backgroundPosition: 'center top', backgroundRepeat: 'repeat-y' });
  } else {
    Object.assign(st, { backgroundImage: 'none' });
  }
}
applyLook();
</script>
